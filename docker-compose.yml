version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexmart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexmart
      POSTGRES_USER: nexmart
      POSTGRES_PASSWORD: nexmart_pass
    ports:
      - "5432:5432"
    volumes:
      - nexmart_pgdata:/var/lib/postgresql/data

volumes:
  nexmart_pgdata:
